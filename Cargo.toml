[package]
name = "nostr-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# Picks dependency versions that build on rust-version (sha2 0.11.1 needs 1.88; 0.11.0 is 1.85).
resolver = "3"
license = "MIT"
description = "BIP-340 Schnorr signatures checked in batches, with a cache of parsed keys: Nostr events verified 2-3x faster"
repository = "https://github.com/VectorPrivacy/nostr-verify"
readme = "README.md"
keywords = ["nostr", "schnorr", "bip340", "secp256k1", "batch"]
categories = ["cryptography"]
exclude = ["bench/"]

[dependencies]
# The version rust-nostr 0.45 links, so an app using both carries one libsecp256k1.
secp256k1 = { version = "0.30", default-features = false, features = ["std"] }
# 0.11: ARMv8 SHA-256 and SHA-NI by runtime detection, no asm feature (0.10 hashes in
# software on aarch64 without it, and its asm breaks Windows builds).
sha2 = { version = "0.11", default-features = false }
getrandom = "0.2"

[features]
# For wasm32-unknown-unknown in a browser: the weights' randomness from the Web Crypto API.
js = ["getrandom/js"]

[dev-dependencies]
num-bigint = "0.4"
rand = "0.8"
secp256k1 = { version = "0.30", default-features = false, features = ["std", "rand"] }
